<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Based Webpage</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="main">
      <!-- Left section of the page -->
      <!-- Top of the Left Section -->
      <div class="leftDiv">
        <div class="topSubDiv">
          <img
            src="tree.png"
            alt="Half tree-logo with a chainsaw"
            class="logo"
          />
          <div class="topHead">
            <h4 class="head1">Menu</h4>
            <h4 class="head2">Contact</h4>
            <h4 class="head3">Join</h4>
            <h4 class="head4">Donate</h4>
            <h4 class="head5">Share</h4>
          </div>
        </div>

        <!-- Middle of the Left Section -->
        <div class="midSubDiv">
          <h1 class="heading1">What You Kill Today</h1>
          <h1 class="heading2">Will Haunt</h1>
          <h1 class="heading3">Your</h1>
          <h1 class="heading4"><span>"</span>Bloodline<span>"</span></h1>
        </div>
        <div class="bottomSubDiv">
          The forest was once a lullaby. You turned it into a funeral song. And
          now, even your shadows tremble under the sunless sky.
        </div>
      </div>

      <!-- The right section of the section -->
      <div class="rightDiv">
        <img class="rightImage" src="rightImage.jpg" alt="Image of a man Cutting the trees and a tree is crying along with 3 deers in the jungle.">
      </div>
    </div>
  </body>
</html>
